# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Verify Code Formatting
      run: dotnet format --verify-no-changes --no-restore --exclude src/Filin/tests/ src/Filin.Abstractions/tests/ playground/
    - name: Verify Code Formatting - codegen
      run: dotnet format --verify-no-changes --no-restore --include src/Filin/tests/ src/Filin.Abstractions/tests/ playground/ --exclude-diagnostics CS0246 CS0535
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build --verbosity normal -c Release
